<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель управления БД</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f4f7f6; }
        .box { background: white; padding: 20px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 15px; }
        .group { display: flex; flex-direction: column; }
        .group label { font-size: 11px; font-weight: bold; margin-bottom: 4px; color: #444; }
        .group input, .group select { padding: 6px; border: 1px solid #ccc; border-radius: 4px; }
        .sub { font-size: 13px; font-weight: bold; margin: 10px 0; padding-bottom: 3px; border-bottom: 2px solid; }
        .u-title { color: #007bff; border-color: #007bff; }
        .p-title { color: #28a745; border-color: #28a745; }
        .btn-blue { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-amber { padding: 10px 20px; background: #ffc107; color: black; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 15px; }
        .t-wrap { overflow-x: auto; background: white; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 1700px; }
        th, td { padding: 8px; text-align: left; border: 1px solid #e0e0e0; }
        .th-u { background: #007bff; color: white; text-align: center; }
        .th-p { background: #28a745; color: white; text-align: center; }
        .bg-u { background: #e6f2ff; font-weight: bold; }
        .bg-p { background: #e8f5e9; font-weight: bold; }
    </style>
</head>
<body>

    <!-- ФОРМА ДОБАВЛЕНИЯ -->
    <div class="box">
        <h3 style="margin-top:0;">➕ Ввод новых данных вручную</h3>
        <form id="userForm">
            <div class="sub u-title">Личные данные (Users)</div>
            <div class="grid">
                <div class="group"><label>Фамилия *</label><input type="text" id="last_name" required></div>
                <div class="group"><label>Имя *</label><input type="text" id="first_name" required></div>
                <div class="group"><label>Отчество</label><input type="text" id="middle_name"></div>
                <div class="group"><label>Пол *</label><select id="gender"><option>Мужской</option><option>Женский</option></select></div>
                <div class="group"><label>Дата рождения *</label><input type="date" id="birth_date" required></div>
                <div class="group"><label>Моб. телефон *</label><input type="text" id="mobile_phone" required></div>
                <div class="group"><label>Домашний телефон</label><input type="text" id="home_phone"></div>
                <div class="group"><label>Email *</label><input type="email" id="email" required></div>
            </div>

            <div class="sub p-title">Паспортные данные (Passports)</div>
            <div class="grid">
                <div class="group"><label>Серия и Номер *</label><input type="text" id="passport_series_number" required></div>
                <div class="group"><label>Дата выдачи *</label><input type="date" id="issue_date" required></div>
                <div class="group"><label>Код подразделения *</label><input type="text" id="department_code" required></div>
                <div class="group"><label>Кем выдан *</label><input type="text" id="issued_by" required></div>
                <div class="group"><label>Место рождения *</label><input type="text" id="birth_place" required></div>
                <div class="group"><label>Адрес проживания *</label><input type="text" id="address" required></div>
                <div class="group"><label>Загранпаспорт</label><input type="text" id="foreign_passport"></div>
            </div>
            <button type="submit" class="btn-blue">Сохранить запись</button>
        </form>
    </div>

    <!-- ВЫВОД ТАБЛИЦ -->
    <h3>Сводный просмотр таблиц</h3>
    <button class="btn-amber" id="regenBtn">🔄 Сгенерировать новые 1001 случайных данных</button>
    <div id="count" style="font-weight:bold; margin-bottom:10px;">Строк: 0</div>

    <div class="t-wrap">
        <table>
            <thead>
                <tr>
                    <th rowspan="2" style="background:#333; color:white; text-align:center;">ID</th>
                    <th colspan="8" class="th-u">ТАБЛИЦА: USERS</th>
                    <th colspan="11" class="th-p">ТАБЛИЦА: PASSPORTS</th>
                </tr>
                <tr>
                    <th class="bg-u">Фамилия</th><th class="bg-u">Имя</th><th class="bg-u">Отчество</th><th class="bg-u">Пол</th><th class="bg-u">Дата р.</th><th class="bg-u">Моб.</th><th class="bg-u">Дом.</th><th class="bg-u">Email</th>
                    <th class="bg-p">Паспорт №</th><th class="bg-p">Фамилия</th><th class="bg-p">Имя</th><th class="bg-p">Отчество</th><th class="bg-p">Дата р.</th><th class="bg-p">Выдан</th><th class="bg-p">Код</th><th class="bg-p">Кем выдан</th><th class="bg-p">Место р.</th><th class="bg-p">Адрес</th><th class="bg-p">Загран</th>
                </tr>
            </thead>
            <tbody id="tbody"></tbody>
        </table>
    </div>

    <script>
        const tbody = document.getElementById('tbody');
        const count = document.getElementById('count');
        
        async function load() {
            const r = await fetch('/api/users');
            const data = await r.json();
            tbody.innerHTML = '';
            data.forEach(x => {
                tbody.insertAdjacentHTML('beforeend', `<tr>
                    <td style="font-weight:bold; background:#f8f9fa;">${x.id}</td>
                    <td>${x.last_name}</td><td>${x.first_name}</td><td>${x.middle_name||'-'}</td><td>${x.gender}</td><td>${x.birth_date}</td><td>${x.mobile_phone}</td><td>${x.home_phone}</td><td>${x.email}</td>
                    <td><code>${x.passport_series_number}</code></td><td>${x.last_name}</td><td>${x.first_name}</td><td>${x.middle_name||'-'}</td><td>${x.birth_date}</td><td>${x.issue_date}</td><td>${x.department_code}</td><td>${x.issued_by}</td><td>${x.birth_place}</td><td>${x.address}</td><td>${x.foreign_passport}</td>
                </tr>`);
            });
            count.textContent = `Строк: ${data.length}`;
        }

        document.getElementById('regenBtn').addEventListener('click', async () => {
            tbody.innerHTML = '<tr><td colspan="20" style="text-align:center;">Генерация данных...</td></tr>';
            await fetch('/api/regenerate', {method:'POST'});
            load();
        });

        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {};
            ['last_name','first_name','middle_name','gender','birth_date','mobile_phone','home_phone','email','passport_series_number','issue_date','department_code','issued_by','birth_place','address','foreign_passport'].forEach(id => {
                payload[id] = document.getElementById(id).value;
            });
            const r = await fetch('/api/users', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if(r.ok) { document.getElementById('userForm').reset(); load(); }
        });

        load();
    </script>
</body>
</html>
